<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Uzaktan M&#252;&#351;teri Edinimi S&#252;reci - Ters U Ak&#305;&#351; Diyagram&#305;</title>
  <desc id="desc">Uzaktan m&#252;&#351;teri edinimi ak&#305;&#351;&#305;n&#305; renkli kartlar, karar noktalar&#305; ve ters U d&#252;zeninde g&#246;steren s&#252;re&#231; diyagram&#305;.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="45%" stop-color="#14233f"/>
      <stop offset="100%" stop-color="#090b18"/>
    </linearGradient>

    <radialGradient id="haloCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ee7ff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dff7ff"/>
    </linearGradient>

    <linearGradient id="cardPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eee7ff"/>
    </linearGradient>

    <linearGradient id="cardGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ddffe9"/>
    </linearGradient>

    <linearGradient id="decisionGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="100%" stop-color="#ffd36b"/>
    </linearGradient>

    <linearGradient id="rejectGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f1"/>
      <stop offset="100%" stop-color="#ffc9c9"/>
    </linearGradient>

    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="48%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#5ee7ff"/>
    </marker>

    <style>
      .title { font: 800 34px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0.5px; }
      .subtitle { font: 500 15px Arial, Helvetica, sans-serif; fill: #b9d6ff; }
      .step-title { font: 800 17px Arial, Helvetica, sans-serif; fill: #14213d; }
      .step-line { font: 600 14px Arial, Helvetica, sans-serif; fill: #26364f; }
      .small { font: 700 12px Arial, Helvetica, sans-serif; fill: #42526e; }
      .badge-text { font: 900 14px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .label { font: 900 13px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0.7px; }
      .flow { fill: none; stroke: url(#flowGrad); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); filter: url(#softGlow); }
      .flow-muted { fill: none; stroke: #60a5fa; stroke-width: 4; stroke-dasharray: 10 9; stroke-linecap: round; marker-end: url(#arrow); opacity: 0.78; }
      .node { filter: url(#shadow); }
      .icon-ring { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .icon-text { font: 900 16px Arial, Helvetica, sans-serif; fill: #1d4ed8; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="190" cy="145" r="215" fill="url(#haloCyan)"/>
  <circle cx="1195" cy="680" r="250" fill="url(#haloViolet)"/>
  <circle cx="690" cy="810" r="230" fill="url(#haloCyan)" opacity="0.45"/>
  <path d="M 70 760 C 250 850, 500 885, 700 835 S 1100 735, 1320 825" fill="none" stroke="#334155" stroke-width="2" opacity="0.45"/>
  <path d="M 1085 65 C 1248 95, 1315 190, 1288 320" fill="none" stroke="#475569" stroke-width="2" opacity="0.45"/>

  <text x="700" y="54" text-anchor="middle" class="title">Uzaktan M&#252;&#351;teri Edinimi Ak&#305;&#351;&#305;</text>
  <text x="700" y="80" text-anchor="middle" class="subtitle">Ters U d&#252;zeni: soldan sa&#287;a, a&#351;a&#287;&#305;ya ve sonra sa&#287;dan sola ilerleyen daha dinamik s&#252;re&#231; g&#246;r&#252;n&#252;m&#252;.</text>

  <!-- Main flow connectors: top row, right column, bottom row -->
  <path class="flow" d="M 210 145 H 270"/>
  <path class="flow" d="M 470 145 H 525"/>
  <path class="flow" d="M 725 145 H 780"/>
  <path class="flow" d="M 980 145 H 1035"/>
  <path class="flow" d="M 1160 215 V 280"/>
  <path class="flow" d="M 1160 405 V 470"/>
  <path class="flow" d="M 1085 595 C 1030 645, 980 675, 920 695"/>
  <path class="flow" d="M 790 710 H 705"/>
  <path class="flow" d="M 505 710 H 420"/>
  <path class="flow-muted" d="M 860 762 V 807"/>

  <!-- Start -->
  <g class="node">
    <ellipse cx="140" cy="145" rx="72" ry="45" fill="#ffffff"/>
    <ellipse cx="140" cy="145" rx="62" ry="36" fill="#e0f2fe"/>
    <text x="140" y="140" text-anchor="middle" class="step-title">BA&#350;LA</text>
    <text x="140" y="160" text-anchor="middle" class="small">S&#252;re&#231; a&#231;&#305;l&#305;r</text>
  </g>

  <!-- Step 1 -->
  <g class="node">
    <rect x="270" y="95" width="200" height="100" rx="24" fill="url(#cardBlue)"/>
    <circle cx="302" cy="112" r="18" fill="#2563eb"/>
    <text x="302" y="117" text-anchor="middle" class="badge-text">1</text>
    <circle cx="370" cy="126" r="22" class="icon-ring"/>
    <text x="370" y="132" text-anchor="middle" class="icon-text">GO</text>
    <text x="370" y="158" text-anchor="middle" class="step-title">Uzaktan Edinim</text>
    <text x="370" y="178" text-anchor="middle" class="step-line">S&#252;reci ba&#351;lat&#305;l&#305;r</text>
  </g>

  <!-- Step 2 -->
  <g class="node">
    <rect x="525" y="95" width="200" height="100" rx="24" fill="url(#cardPurple)"/>
    <circle cx="557" cy="112" r="18" fill="#7c3aed"/>
    <text x="557" y="117" text-anchor="middle" class="badge-text">2</text>
    <circle cx="625" cy="126" r="22" class="icon-ring"/>
    <text x="625" y="132" text-anchor="middle" class="icon-text">KV</text>
    <text x="625" y="158" text-anchor="middle" class="step-title">Ayd&#305;nlatma Metni</text>
    <text x="625" y="178" text-anchor="middle" class="step-line">ve KVKK sunulur</text>
  </g>

  <!-- Step 3 -->
  <g class="node">
    <rect x="780" y="88" width="200" height="114" rx="24" fill="url(#cardGreen)"/>
    <circle cx="812" cy="105" r="18" fill="#059669"/>
    <text x="812" y="110" text-anchor="middle" class="badge-text">3</text>
    <circle cx="880" cy="119" r="22" class="icon-ring"/>
    <text x="880" y="125" text-anchor="middle" class="icon-text">OK</text>
    <text x="880" y="150" text-anchor="middle" class="step-title">KVKK &#304;zinleri</text>
    <text x="880" y="171" text-anchor="middle" class="step-line">A&#231;&#305;k r&#305;za al&#305;n&#305;r</text>
    <text x="880" y="191" text-anchor="middle" class="small">TF&#350; payla&#351;&#305;m izni</text>
  </g>

  <!-- Step 4 -->
  <g class="node">
    <rect x="1035" y="82" width="250" height="126" rx="26" fill="url(#cardBlue)"/>
    <circle cx="1070" cy="101" r="18" fill="#2563eb"/>
    <text x="1070" y="106" text-anchor="middle" class="badge-text">4</text>
    <circle cx="1160" cy="116" r="24" class="icon-ring"/>
    <text x="1160" y="122" text-anchor="middle" class="icon-text">ID</text>
    <text x="1160" y="150" text-anchor="middle" class="step-title">M&#252;&#351;teri Bilgileri</text>
    <text x="1160" y="172" text-anchor="middle" class="step-line">Banka taraf&#305;ndan toplan&#305;r</text>
    <text x="1160" y="193" text-anchor="middle" class="small">Kimlik, adres, gelir, OCR, NFC vb.</text>
  </g>

  <!-- Step 5 -->
  <g class="node">
    <rect x="1042" y="280" width="236" height="126" rx="26" fill="url(#cardPurple)"/>
    <circle cx="1077" cy="299" r="18" fill="#7c3aed"/>
    <text x="1077" y="304" text-anchor="middle" class="badge-text">5</text>
    <circle cx="1160" cy="319" r="24" class="icon-ring"/>
    <text x="1160" y="325" text-anchor="middle" class="icon-text">AML</text>
    <text x="1160" y="353" text-anchor="middle" class="step-title">AML Kontrolleri</text>
    <text x="1160" y="376" text-anchor="middle" class="step-line">Ger&#231;ekle&#351;tirilir</text>
  </g>

  <!-- Step 6 -->
  <g class="node">
    <rect x="1035" y="470" width="250" height="126" rx="26" fill="url(#cardBlue)"/>
    <circle cx="1070" cy="489" r="18" fill="#2563eb"/>
    <text x="1070" y="494" text-anchor="middle" class="badge-text">6</text>
    <circle cx="1160" cy="511" r="24" class="icon-ring"/>
    <text x="1160" y="517" text-anchor="middle" class="icon-text">CAM</text>
    <text x="1160" y="545" text-anchor="middle" class="step-title">G&#246;r&#252;nt&#252;l&#252; G&#246;r&#252;&#351;me</text>
    <text x="1160" y="568" text-anchor="middle" class="step-line">M&#252;&#351;teri temsilcisiyle yap&#305;l&#305;r</text>
  </g>

  <!-- Decision -->
  <g class="node">
    <path d="M 860 628 L 980 710 L 860 792 L 740 710 Z" fill="url(#decisionGrad)"/>
    <circle cx="817" cy="677" r="18" fill="#f59e0b"/>
    <text x="817" y="682" text-anchor="middle" class="badge-text">7</text>
    <text x="860" y="699" text-anchor="middle" class="step-title">S&#252;re&#231;</text>
    <text x="860" y="722" text-anchor="middle" class="step-title">Onayland&#305; m&#305;?</text>
  </g>

  <g>
    <rect x="714" y="682" width="54" height="26" rx="13" fill="#16a34a"/>
    <text x="741" y="700" text-anchor="middle" class="label">EVET</text>
  </g>

  <g>
    <rect x="830" y="805" width="60" height="26" rx="13" fill="#dc2626"/>
    <text x="860" y="823" text-anchor="middle" class="label">HAYIR</text>
  </g>

  <!-- Approved -->
  <g class="node">
    <rect x="505" y="650" width="200" height="120" rx="26" fill="url(#cardGreen)"/>
    <circle cx="537" cy="669" r="18" fill="#16a34a"/>
    <text x="537" y="674" text-anchor="middle" class="badge-text">8</text>
    <circle cx="605" cy="691" r="24" class="icon-ring"/>
    <text x="605" y="697" text-anchor="middle" class="icon-text">OK</text>
    <text x="605" y="724" text-anchor="middle" class="step-title">M&#252;&#351;teri Olur</text>
    <text x="605" y="746" text-anchor="middle" class="step-line">G&#252;venli payla&#351;&#305;m</text>
    <text x="605" y="766" text-anchor="middle" class="small">s&#252;reci i&#351;letilir</text>
  </g>

  <!-- End -->
  <g class="node">
    <ellipse cx="335" cy="710" rx="86" ry="48" fill="#ffffff"/>
    <ellipse cx="335" cy="710" rx="74" ry="39" fill="#dcfce7"/>
    <text x="335" y="705" text-anchor="middle" class="step-title">SON</text>
    <text x="335" y="727" text-anchor="middle" class="small">Tamamland&#305;</text>
  </g>

  <!-- Rejected -->
  <g class="node">
    <rect x="735" y="830" width="250" height="54" rx="20" fill="url(#rejectGrad)"/>
    <text x="860" y="853" text-anchor="middle" class="step-title">Ba&#351;vuru reddedilir</text>
    <text x="860" y="873" text-anchor="middle" class="step-line">M&#252;&#351;teri bilgilendirilir</text>
  </g>

  <g opacity="0.85">
    <rect x="88" y="820" width="304" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="240" y="846" text-anchor="middle" class="subtitle">Ters U ak&#305;&#351;: soldan sa&#287;a, a&#351;a&#287;&#305;, sonra sa&#287;dan sola</text>
  </g>
</svg>
